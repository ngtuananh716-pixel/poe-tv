# Build bản sửa poe-tv của CouchSubs.
# Chỉ build lại 2 DLL từ mã gốc v0.1.0-beta.70 cộng bản vá trong couchsubs-patch/:
#   CouchSubs.Shell.dll       – móc tra giá, bật/tắt dịch, giữ tiếng Anh khi thiếu khóa AI
#   CouchSubs.Translation.dll – lời nhắc AI dịch sang tiếng Việt
# Hai DLL thay vào một BẢN SAO của CouchSubs beta.70 đã cài trên laptop; bản cài chính thức giữ nguyên.
name: build

on:
  push:
    branches: [main]
    paths: ["couchsubs-patch/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write   # đẩy DLL đã build vào nhánh dist

env:
  UPSTREAM_TAG: v0.1.0-beta.70

jobs:
  shell:
    # CouchSubs.Shell nhắm net10.0 (không riêng Windows) nên build được trên Linux, rẻ hơn máy Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mã gốc CouchSubs ${{ env.UPSTREAM_TAG }}
        uses: actions/checkout@v4
        with:
          repository: yorulmazsinan/couchsubs
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Áp bản vá poe-tv
        run: |
          cp couchsubs-patch/PoeTvBridge.cs upstream/windows/src/CouchSubs.Shell/
          git -C upstream apply --verbose ../couchsubs-patch/appcontroller.patch
          git -C upstream apply --verbose ../couchsubs-patch/aitranslator.patch

      - name: Build CouchSubs.Shell và CouchSubs.Translation
        run: |
          VERSION="${UPSTREAM_TAG#v}"
          dotnet build upstream/windows/src/CouchSubs.Shell -c Release -p:Version="$VERSION" -o out
          dotnet build upstream/windows/src/CouchSubs.Translation -c Release -p:Version="$VERSION" -o out_tr
          cp out_tr/CouchSubs.Translation.dll out/
          ls -la out/CouchSubs.Shell.dll out/CouchSubs.Translation.dll

      - uses: actions/upload-artifact@v4
        with:
          name: poe-tv-shell
          path: |
            out/CouchSubs.Shell.dll
            out/CouchSubs.Translation.dll
          if-no-files-found: error
          retention-days: 30

      # Nhánh dist chỉ giữ bản build mới nhất (1 commit, ghi đè mỗi lần): tải DLL qua git, không qua kho artifact.
      - name: Đẩy DLL vào nhánh dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cp out/CouchSubs.Shell.dll out/CouchSubs.Translation.dll dist/
          cd dist
          echo "Build từ commit ${GITHUB_SHA} trên mã gốc ${UPSTREAM_TAG}" > BUILD.txt
          sha256sum CouchSubs.Shell.dll CouchSubs.Translation.dll >> BUILD.txt
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "DLL từ ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
