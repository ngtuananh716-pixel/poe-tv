# Build bản sửa poe-tv của CouchSubs.
# Chỉ build lại CouchSubs.Shell.dll (nơi có chỗ móc tra giá) từ mã gốc v0.1.0-beta.70 cộng bản vá trong couchsubs-patch/.
# DLL này thay vào một BẢN SAO của CouchSubs beta.70 đã cài trên laptop; bản cài chính thức giữ nguyên.
name: build

on:
  push:
    branches: [main]
    paths: ["couchsubs-patch/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_TAG: v0.1.0-beta.70

jobs:
  shell:
    # CouchSubs.Shell nhắm net10.0 (không riêng Windows) nên build được trên Linux, rẻ hơn máy Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mã gốc CouchSubs ${{ env.UPSTREAM_TAG }}
        uses: actions/checkout@v4
        with:
          repository: yorulmazsinan/couchsubs
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Áp bản vá poe-tv
        run: |
          cp couchsubs-patch/PoeTvBridge.cs upstream/windows/src/CouchSubs.Shell/
          git -C upstream apply --verbose ../couchsubs-patch/appcontroller.patch

      - name: Build CouchSubs.Shell
        run: |
          VERSION="${UPSTREAM_TAG#v}"
          dotnet build upstream/windows/src/CouchSubs.Shell -c Release -p:Version="$VERSION" -o out
          ls -la out/CouchSubs.Shell.dll

      - uses: actions/upload-artifact@v4
        with:
          name: poe-tv-shell
          path: out/CouchSubs.Shell.dll
          if-no-files-found: error
          retention-days: 30
